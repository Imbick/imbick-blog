<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MI5 Secure Access</title>
    <style>
        body {
            background: #000;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 255, 0, 0.05);
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 0 40px #00ff00, 0 0 10px #00ff00 inset;
        }

        .mi5-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .mi5-title {
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 12px #00ff00;
            letter-spacing: 2px;
        }

        label {
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.2em;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #00ff00;
        }

        input[type="password"] {
            background: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 1.2em;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            box-shadow: 0 0 10px #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

            input[type="password"]:focus {
                border-color: #39ff14;
            }

        button {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 30px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-family: 'Consolas', 'Courier New', monospace;
            box-shadow: 0 0 10px #00ff00;
            transition: background 0.2s;
        }

            button:hover {
                background: #00ff00;
                color: #000;
            }

        .message {
            margin-top: 15px;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1em;
            text-shadow: 0 0 8px #00ff00;
        }

        .error {
            color: #ff0040;
            text-shadow: 0 0 8px #ff0040;
        }
    </style>
</head>

    <script>
        const correctPassword = "matrix42"; // Set your password here

        function checkPassword() {
            var passwordElement = document.getElementById('password')
            const input = passwordElement.value;
            const message = document.getElementById('message');
            if (input === correctPassword) {
                message.classList.remove('error');
                message.textContent = "Access Granted. Redirecting...";
                var elements = document.getElementsByClassName('form');
                for (var i = 0; i < elements.length; i++) {
                    elements[i].style.display = 'none';
                }
                setTimeout(function () {
                    window.location.href = "./news.html";
                }, 3000);
            } else {
                message.textContent = "Access Denied. Incorrect password.";
                message.classList.add('error');
                passwordElement.value = "";
                passwordElement.focus();
            }
        }

        document.getElementById('password').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
