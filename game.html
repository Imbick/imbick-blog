<!DOCTYPE html>
<html>
<head>
    <title>4-Player Touch Pong</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #222;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="pong"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        // Score setup
        let score = 500;
        let cracked = false;

        // Matrix effect setup
        const glyphs = 'ᨀᨁᨂᨃᨄᨅᨆᨇᨈᨉᨊᨋᨌᨍᨎᨏᨐᨑᨒᨓᨔᨕᨖꤢᠠᠡᠢᠤᠥᠧᠨᠩᠪᠫᠬᠭᠮᠯᠰᠱᠲᠴᠵᠶᠷᠸᠹᠺᠻᠼᠽ';

        const fontSize = 20;
        let matrixRows = [];
        let lastGlyphTime = 0;
        const glyphInterval = 200; // ms

        // Two paddles on left, two on right
        let paddles = [
            { x: 20, y: 100, w: 20, h: 100, frozenUntil: 0 },   // Left Top
            { x: 20, y: 400, w: 20, h: 100, frozenUntil: 0 },   // Left Bottom
            { x: canvas.width - 40, y: 100, w: 20, h: 100, frozenUntil: 0 },   // Right Top
            { x: canvas.width - 40, y: 400, w: 20, h: 100, frozenUntil: 0 }    // Right Bottom
        ];

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initMatrixRows();
            updatePaddlePositions();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updatePaddlePositions() {
            paddles[2].x = canvas.width - 40;
            paddles[3].x = canvas.width - 40;
        }

        // Map touch identifiers to paddles
        let touchToPaddle = {};

        canvas.addEventListener('touchstart', function (e) {
            for (let t of e.changedTouches) {
                let idx = getNearestPaddle(t.clientX, t.clientY);
                touchToPaddle[t.identifier] = idx;
                movePaddle(idx, t.clientY);
            }
        });

        canvas.addEventListener('touchmove', function (e) {
            e.preventDefault();
            for (let t of e.changedTouches) {
                let idx = touchToPaddle[t.identifier];
                if (idx !== undefined) movePaddle(idx, t.clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function (e) {
            for (let t of e.changedTouches) {
                delete touchToPaddle[t.identifier];
            }
        });

        function getNearestPaddle(x, y) {
            let dists = paddles.map(p => Math.hypot(p.x + p.w / 2 - x, p.y + p.h / 2 - y));
            return dists.indexOf(Math.min(...dists));
        }

        function movePaddle(idx, y) {
            let p = paddles[idx];
            // Only move if not frozen
            if (Date.now() < p.frozenUntil) return;
            p.y = Math.max(0, Math.min(canvas.height - p.h, y - p.h / 2));
        }

        // Pyramid shape: more glyphs in the center, fewer at top/bottom
        function pyramidWidth(row, totalRows, maxWidth) {
            let center = totalRows / 2;
            let dist = Math.abs(row - center);
            let norm = 1 - (dist / center);
            return Math.max(1, Math.round(norm * maxWidth));
        }

        function initMatrixRows() {
            matrixRows = [];
            let totalRows = Math.floor(canvas.height / fontSize);
            let maxWidth = Math.floor(canvas.width / (fontSize * 2.5));
            for (let i = 0; i < totalRows; i++) {
                let width = pyramidWidth(i, totalRows, maxWidth);
                let row = [];
                for (let j = 0; j < width; j++) {
                    row.push(null);
                }
                matrixRows.push(row);
            }
        }

        // Balls setup
        function spawnBall(side, type = "green") {
            let y = Math.random() * (canvas.height - 40) + 20;
            let speed = type === "red" ? 3 : 10;
            let dir = side === 'left' ? 1 : -1;
            return {
                x: side === 'left' ? 100 : canvas.width - 100,
                y: y,
                vx: dir * speed,
                vy: (Math.random() - 0.5) * 3,
                radius: 6,
                color: type === "red" ? "#f00" : "#0f0",
                type: type
            };
        }

        let balls = [
            spawnBall('left'),
            spawnBall('left'),
            spawnBall('right'),
            spawnBall('right')
        ];

        // Red ball spawn logic
        let lastRedBallTime = Date.now();
        const redBallInterval = 20000; // ms

        window.addEventListener('resize', function () {
            balls = [
                spawnBall('left'),
                spawnBall('left'),
                spawnBall('right'),
                spawnBall('right')
            ];
        });

        // Ball and paddle collision
        function ballPaddleCollision(ball, paddle) {
            return (
                ball.x + ball.radius > paddle.x &&
                ball.x - ball.radius < paddle.x + paddle.w &&
                ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.h
            );
        }

        // Ball and matrix glyph collision
        function ballMatrixCollision(ball) {
            if (ball.type === "red") {
                return;
            }

            let rowIdx = Math.floor(ball.y / fontSize);
            if (rowIdx < 0 || rowIdx >= matrixRows.length) return null;
            let row = matrixRows[rowIdx];
            let rowWidth = row.length;
            let centerX = canvas.width / 2;
            for (let i = 0; i < rowWidth; i++) {
                if (row[i] !== null) {
                    let x = centerX + (i - Math.floor(rowWidth / 2)) * fontSize;
                    if (
                        ball.x + ball.radius > x - fontSize / 2 &&
                        ball.x - ball.radius < x + fontSize / 2
                    ) {
                        return { rowIdx, colIdx: i, x: x, y: rowIdx * fontSize + fontSize / 2 };
                    }
                }
            }
            return null;
        }

        function updateMatrix() {
            let now = performance.now();
            if (now - lastGlyphTime > glyphInterval) {
                lastGlyphTime = now;
                let totalRows = matrixRows.length;
                let weights = [];
                let center = totalRows / 2;
                for (let i = 0; i < totalRows; i++) {
                    let dist = Math.abs(i - center);
                    weights.push(1 - dist / center);
                }
                let sum = weights.reduce((a, b) => a + b, 0);
                let r = Math.random() * sum;
                let idx = 0;
                for (; idx < totalRows; idx++) {
                    r -= weights[idx];
                    if (r <= 0) break;
                }
                let row = matrixRows[idx];
                let mid = Math.floor(row.length / 2);
                let slot = null;
                for (let offset = 0; offset <= mid; offset++) {
                    if (row[mid - offset] === null) { slot = mid - offset; break; }
                    if (row[mid + offset] === null) { slot = mid + offset; break; }
                }
                if (slot !== null) {
                    row[slot] = glyphs[Math.floor(Math.random() * glyphs.length)];
                }
            }
        }

        function updateBalls() {
            // Red ball spawn logic
            if (Date.now() - lastRedBallTime > redBallInterval) {
                lastRedBallTime = Date.now();
                // Spawn a red ball from a random side
                let side = Math.random() < 0.5 ? 'left' : 'right';
                balls.push(spawnBall(side, "red"));
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Bounce off top/bottom
                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                    ball.vy *= -1;
                }

                // Bounce off paddles
                for (let pIdx = 0; pIdx < paddles.length; pIdx++) {
                    let p = paddles[pIdx];
                    if (ballPaddleCollision(ball, p)) {
                        // If red ball, freeze paddle
                        if (ball.type === "red") {
                            paddles[pIdx].frozenUntil = Date.now() + 4000;
                            balls.splice(i, 1);
                            continue;
                        }
                        ball.vx *= -1;
                        ball.vy += (Math.random() - 0.5) * 2;
                        if (ball.vx > 0) ball.x = p.x + p.w + ball.radius;
                        else ball.x = p.x - ball.radius;
                    }
                }

                // Matrix glyph collision
                let glyphHit = ballMatrixCollision(ball);
                if (glyphHit) {
                    // Remove the glyph
                    matrixRows[glyphHit.rowIdx][glyphHit.colIdx] = null;

                    // Only decrement score for green balls and if not already cracked
                    if (ball.type === "green" && !cracked) {
                        score = Math.max(0, score - 1);
                        if (score === 0) {
                            cracked = true;
                        }
                    }

                    if (ball.radius < 30)
                        ball.radius *= 1.1;

                    continue;
                }

                // Hit left/right wall: remove and respawn
                if (ball.x - ball.radius < 0) {
                    balls.splice(i, 1);
                    if (ball.type !== "red") { //only green balls respawn
                        balls.push(spawnBall('left', ball.type === "red" ? "red" : "green"));
                    }
                } else if (ball.x + ball.radius > canvas.width) {
                    balls.splice(i, 1);
                    if (ball.type !== "red") { //only green balls respawn
                        balls.push(spawnBall('right', ball.type === "red" ? "red" : "green"));
                    }
                }
            }
        }

        function drawMatrix() {
            ctx.font = fontSize + "px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let centerX = canvas.width / 2;
            for (let i = 0; i < matrixRows.length; i++) {
                let row = matrixRows[i];
                let y = i * fontSize + fontSize / 2;
                let rowWidth = row.length;
                for (let j = 0; j < rowWidth; j++) {
                    if (row[j] !== null) {
                        let x = centerX + (j - Math.floor(rowWidth / 2)) * fontSize;
                        ctx.fillStyle = "#0f0";
                        ctx.fillText(row[j], x, y);
                    }
                }
            }
        }

        function drawBalls() {
            for (let ball of balls) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.strokeStyle = ball.color;
                ctx.stroke();
            }
        }

        function drawScore() {
            ctx.save();
            ctx.font = "bold 40px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = cracked ? "#f00" : "#0f0";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 8;
            ctx.fillText(cracked ? "Cracked" : score, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw center vertical line
            ctx.strokeStyle = '#0f0';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Draw matrix effect
            drawMatrix();

            // Draw paddles
            for (let p of paddles) {
                if (Date.now() < p.frozenUntil) {
                    ctx.fillStyle = "#f00";
                } else {
                    ctx.fillStyle = "#0f0";
                }

                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            // Draw balls
            drawBalls();

            // Draw score/message
            drawScore();
        }

        function gameLoop() {
            updateMatrix();
            updateBalls();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
