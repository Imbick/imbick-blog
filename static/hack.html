<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>MI5 News Article Search</title>
	<style>
		#spinner-game-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0,0,0,0.97);
			z-index: 9999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: #00ff00;
			font-family: 'Consolas', 'Courier New', monospace;
			display: none;
		}

		#spinner-game-canvas {
			background: #111;
			border: 2px solid #00ff00;
			border-radius: 16px;
			box-shadow: 0 0 40px #00ff00, 0 0 10px #00ff00 inset;
			margin-bottom: 20px;
			display: block;
		}

		#spinner-game-status {
			font-size: 1.2em;
			margin-bottom: 10px;
		}

		#spinner-game-btn {
			margin-top: 10px;
			padding: 10px 30px;
			background: #000;
			color: #00ff00;
			border: 2px solid #00ff00;
			border-radius: 6px;
			font-size: 1.2em;
			cursor: pointer;
			box-shadow: 0 0 10px #00ff00;
			transition: background 0.2s;
		}

			#spinner-game-btn:hover {
				background: #00ff00;
				color: #000;
			}
	</style>
</head>
<body>
	<div id="spinner-game-overlay">
		<div style="font-size:2em;margin-bottom:10px;">Hacking Spinner Challenge</div>
		<canvas id="spinner-game-canvas" width="500" height="300"></canvas>
		<div id="spinner-game-status"></div>
		<button id="spinner-game-btn">Start Game</button>
	</div>
	<script>
		(function () {
			// Game config
			const NODE_COUNT = 4;
			const NODE_RADIUS = 40;
			const POINTER_LENGTH = 35;
			const CONNECTION_WIDTH = 6;
			const ALIGN_TOLERANCE = Math.PI / 16; // radians
			const SPIN_SPEEDS = [0.025, 0.035, 0.045, 0.055]; // radians per frame

			// DOM
			const overlay = document.getElementById('spinner-game-overlay');
			const canvas = document.getElementById('spinner-game-canvas');
			const ctx = canvas.getContext('2d');
			const statusDiv = document.getElementById('spinner-game-status');
			const btn = document.getElementById('spinner-game-btn');

			// State
			let nodes, current, running, startTime, endTime, animationId;

			function resetGame() {
				nodes = [];
				let spacing = (canvas.width - 2 * NODE_RADIUS) / (NODE_COUNT - 1);
				for (let i = 0; i < NODE_COUNT; ++i) {
					nodes.push({
						x: NODE_RADIUS + i * spacing,
						y: canvas.height / 2,
						angle: Math.random() * Math.PI * 2,
						speed: SPIN_SPEEDS[i % SPIN_SPEEDS.length],
						hacked: false
					});
				}
				current = 0;
				running = false;
				startTime = null;
				endTime = null;
				statusDiv.textContent = "Click the spinning disk when the pointer aligns with the connection!";
			}


            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Always show the first two nodes at the start, then reveal the next node after each connection
                let lastVisible = Math.max(1, current);

                // Draw connections up to the current node
                for (let i = 0; i < lastVisible; ++i) {
                    if (i + 1 < nodes.length) {
                        ctx.save();
                        ctx.strokeStyle = nodes[i].hacked ? "#39ff14" : "#444";
                        ctx.lineWidth = CONNECTION_WIDTH;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[i + 1].x, nodes[i + 1].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                // Draw nodes up to and including the last visible node
                for (let i = 0; i <= lastVisible && i < nodes.length; ++i) {
                    let node = nodes[i];
                    ctx.save();
                    ctx.translate(node.x, node.y);

                    // Disk
                    ctx.beginPath();
                    ctx.arc(0, 0, NODE_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = node.hacked ? "#39ff14" : (i === lastVisible ? "#00ff00" : "#222");
                    ctx.shadowColor = "#00ff00";
                    ctx.shadowBlur = node.hacked ? 20 : 8;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#00ff00";
                    ctx.stroke();

                    // Pointer (only animate the "active" node)
                    ctx.rotate(node.angle);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(POINTER_LENGTH, 0);
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = node.hacked ? "#fff" : "#ff0040";
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // --- Replace the update() function with the following: ---
            function update() {
                if (!running) return;
                // Only spin the "active" node (the second visible one)
                let lastVisible = Math.max(1, current);
                if (!nodes[lastVisible].hacked) {
                    nodes[lastVisible].angle += nodes[lastVisible].speed;
                    if (nodes[lastVisible].angle > Math.PI * 2) nodes[lastVisible].angle -= Math.PI * 2;
                }
            }


			function gameLoop() {
				update();
				draw();
				animationId = requestAnimationFrame(gameLoop);
			}

			function isAligned(nodeIdx) {
				if (nodeIdx >= nodes.length - 1) return false;
				// Angle to next node
				let node = nodes[nodeIdx];
				let next = nodes[nodeIdx + 1];
				let dx = next.x - node.x, dy = next.y - node.y;
				let targetAngle = Math.atan2(dy, dx);
				// Normalize angles
				let diff = Math.abs(((node.angle - targetAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
				return diff < ALIGN_TOLERANCE;
			}

            function handleClick(evt) {
                if (!running) return;
                let rect = canvas.getBoundingClientRect();
                let mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
                let lastVisible = Math.max(1, current);
                let node = nodes[lastVisible];
                let dx = mx - node.x, dy = my - node.y;
                if (dx * dx + dy * dy > NODE_RADIUS * NODE_RADIUS) return; // Not on disk

                if (lastVisible - 1 < nodes.length - 1) {
                    if (isAligned(lastVisible - 1)) {
                        nodes[lastVisible - 1].hacked = true;
                        current++;
                        if (current === nodes.length - 1) {
                            nodes[lastVisible].hacked = true;
                            running = false;
                            endTime = Date.now();
                            statusDiv.textContent = "All nodes hacked! Time: " + ((endTime - startTime) / 1000).toFixed(2) + "s";
                            btn.textContent = "Play Again";
                            btn.style.display = "";
                        } else {
                            statusDiv.textContent = "Good! Next connection...";
                        }
                    } else {
                        // Missed: reset this node's angle
                        nodes[lastVisible].angle = Math.random() * Math.PI * 2;
                        statusDiv.textContent = "Missed! Try again.";
                    }
                }
            }

			btn.onclick = function () {
				resetGame();
				btn.style.display = "none";
				running = true;
				startTime = Date.now();
				gameLoop();
			};

			canvas.addEventListener('mousedown', handleClick);

			// Show the game overlay (for demo, after 1s)
			setTimeout(() => { overlay.style.display = 'flex'; }, 1000);
			resetGame();
			draw();
		})();
	</script>
</body>
</html>
